name: Angular ESLint

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install eslint --save-dev
        working-directory: ${{ github.workspace }}

      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ github.workspace }}
        shell: bash
