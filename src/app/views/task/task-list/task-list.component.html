<c-col xs="12">
  <c-card class="mb-4">
    <c-card-header ngPreserveWhitespaces>
      <strong>Task List</strong>
    </c-card-header>
    <c-card-body>
      <table cTable>
        <thead>
          <tr>
            <th scope="col">#ID</th>
            <th scope="col">Task Name</th>
            <th scope="col">Description</th>
            <th scope="col">Deadlines</th>
            <th scope="col">Priorities</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let task of taskList">
            <td>{{ task.id }}</td>
            <td>{{ task.taskname }}</td>
            <td>{{ task.description }}</td>
            <td>{{ task.deadlines | date:'shortDate' }}</td> <td>{{ task.priorities }}</td>
            <td>
              <button cButton color="danger" size="sm" (click)="deleteTask(task.id)">
                Delete
              </button>
              </td>
          </tr>
          <tr *ngIf="taskList.length === 0">
            <td colspan="5" class="text-center">No tasks found.</td>
          </tr>
        </tbody>
      </table>
    </c-card-body>
  </c-card>
</c-col>
