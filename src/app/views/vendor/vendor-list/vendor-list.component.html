<c-row> 
 <c-col xs="12">
    <c-card class="mb-4">
        <c-card-header ngPreserveWhitespaces>
            <strong>Vendor List</strong>
          </c-card-header>
      <c-card-body>
        <table [bordered]="true" [hover]="true" [striped]="true" cTable >
            <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Company</th>
              <th scope="col">Status</th>
              <th scope="col" class="d-grid gap-2 d-md-flex justify-content-md-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let vendor of vendorList; let i = index" [attr.data-index]="i">
              <th scope="row">{{i + 1}}</th>
                <td>{{vendor.name}}</td>
                <td>{{vendor.company}}</td>
                <td>{{vendor.status}}</td>
                <td>
                  <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button type="button" class="btn btn-sm">
                        <svg cIcon name="cilNotes"></svg>
                    </button>
                    <button type="button" class="btn btn-sm">
                        <svg cIcon name="cilPencil"></svg>
                    </button>
                    <button type="button" class="btn btn-sm" (click)="deleteVendor(vendor.id)">
                        <svg cIcon name="cilTrash"></svg>
                    </button>                 
                  </div>
                </td>
            </tr>
            </tbody>
          </table>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
